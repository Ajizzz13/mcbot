name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build & test (musl static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools mold

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Test (native)
        run: cargo test --release

      - name: Build (musl)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=-fuse-ld=mold"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mcbot-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/mcbot
          retention-days: 30