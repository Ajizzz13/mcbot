[package]
name = "mcbot"
version = "0.1.0"
edition = "2024"
description = "Minecraft bot built with Azalea (Rust)"
license = "MIT"

[dependencies]
azalea = "0.16.0+mc26.3"
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.dev]
debug = "line-tables-only"