[package]
name = "mcbot"
version = "0.1.0"
edition = "2024"
description = "Minecraft bot built with Azalea (Rust)"
license = "MIT"

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea", branch = "26.3", default-features = false, features = ["serde", "online-mode"] }
eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = true

[profile.dev]
debug = "line-tables-only"